- rule: K8s Service Account Token Access
  desc: Detect access to mounted SA token in pod
  condition: >
    open_read and fd.name contains "/var/run/secrets/kubernetes.io/serviceaccount/token"
  output: >
       [Token Theft] SA token file accessed: %fd.name by %proc.cmdline (container=%container.name)
  priority: CRITICAL
  tags: [kubernetes, sa_token, redteam]
